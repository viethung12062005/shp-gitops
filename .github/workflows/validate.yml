# Validate every PR to the GitOps repo (including the bot's promote PRs): YAML, render, kubeconform. Deploys nothing; Argo CD does that.
name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Read-only deploy key of the application repo (N6). Empty until it is provisioned: the checkout below and
      # APP_DIR then skip the drift check and validate.sh says so, instead of the job failing for every PR.
      APP_DEPLOY_KEY: ${{ secrets.APP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: viethung12062005/shp-platform-templates
          ref: main   # TODO CIT-09: ghim tag chart-v0.1.0
          path: templates
          # The templates repo is private: GITHUB_TOKEN cannot read other repos, so use a read-only deploy key (secret TEMPLATES_DEPLOY_KEY).
          ssh-key: ${{ secrets.TEMPLATES_DEPLOY_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # N6: platform/charts/shp-keycloak/files/realm-shp.json is generated by tools/identity/realm.py in the
        # application repo. Check that repo out so validate.sh compares the copy with its source and fails on drift.
        # Read-only deploy key (secret APP_DEPLOY_KEY); while the key is missing the step is skipped and validate.sh
        # prints that the drift check did not run.
        if: env.APP_DEPLOY_KEY != ''
        with:
          repository: viethung12062005/smart-hospital-platform
          ref: main
          path: app
          fetch-depth: 1
          ssh-key: ${{ env.APP_DEPLOY_KEY }}
      - name: Install helm 3.18.6 + kubeconform 0.7.0 (checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin" && cd "$(mktemp -d)"
          curl -sSLO https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz
          curl -sSL https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz.sha256sum | sha256sum -c -
          tar xzf helm-v3.18.6-linux-amd64.tar.gz && mv linux-amd64/helm "$HOME/bin/"
          curl -sSLO https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          curl -sSLO https://github.com/yannh/kubeconform/releases/download/v0.7.0/CHECKSUMS
          grep kubeconform-linux-amd64.tar.gz CHECKSUMS | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform && mv kubeconform "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Validate
        env:
          TEMPLATES_DIR: templates
          # Empty when the application-repo checkout was skipped: validate.sh then reports that the drift check did not run.
          APP_DIR: ${{ env.APP_DEPLOY_KEY != '' && 'app' || '' }}
        run: tools/validate.sh
