# Shared PR checks from the templates repo: gitleaks, actionlint, dependency scans (Trivy fs, OSV-Scanner,
# OWASP Dependency-Check when the NVD_API_KEY secret exists). Pinned to a template release tag.
name: pr-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    uses: viethung12062005/shp-platform-templates/.github/workflows/pr-checks.yml@v0.1.4
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit
