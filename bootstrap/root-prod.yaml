# Root Application (app-of-apps) for the prod cluster. ENV-01 applies this file exactly once after Argo CD is installed.
# The repo read credential (a GitHub App with read access only) is created by ENV-01 as a Secret in namespace argocd — it is not in the repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-prod
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/viethung12062005/shp-gitops.git
    targetRevision: main
    path: clusters/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
