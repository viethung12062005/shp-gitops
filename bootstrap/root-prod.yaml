# Root Application (app-of-apps) cho cụm prod. ENV-01 áp dụng file này đúng một lần sau khi cài Argo CD.
# Credential đọc repo (GitHub App, chỉ quyền đọc) do ENV-01 tạo thành Secret trong namespace argocd — không nằm trong repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-prod
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/viethung12062005/shp-gitops-scratch.git
    targetRevision: main
    path: clusters/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
