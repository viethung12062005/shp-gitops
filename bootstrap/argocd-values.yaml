# Values for the first Argo CD install (ENV-01 runs: helm upgrade --install argocd argo/argo-cd --version 10.11.5 -n argocd -f bootstrap/argocd-values.yaml).
# Then apply bootstrap/root-<env>.yaml; from that point on Argo CD syncs everything else from this repo.
global:
  domain: ""                  # the UI is not exposed to the Internet; reach it with kubectl port-forward
configs:
  params:
    server.insecure: false
  cm:
    admin.enabled: false      # no local admin account; sign in through Entra ID (OIDC) — configured in ENV-01
    timeout.reconciliation: 120s
    resource.exclusions: |
      - apiGroups: ["cilium.io"]
        kinds: ["CiliumIdentity"]
        clusters: ["*"]
  rbac:
    policy.default: role:readonly
server:
  service:
    type: ClusterIP
controller:
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
repoServer:
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
dex:
  enabled: false
notifications:
  enabled: false
