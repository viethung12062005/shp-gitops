# Values khi cài Argo CD lần đầu (ENV-01 chạy: helm upgrade --install argocd argo/argo-cd --version 10.11.5 -n argocd -f bootstrap/argocd-values.yaml).
# Sau đó áp dụng bootstrap/root-<env>.yaml; từ đó mọi thứ khác do Argo CD tự đồng bộ từ repo này.
global:
  domain: ""                  # UI không mở ra Internet; truy cập bằng kubectl port-forward
configs:
  params:
    server.insecure: false
  cm:
    admin.enabled: false      # không dùng tài khoản admin cục bộ; đăng nhập qua Entra ID (OIDC) — cấu hình ở ENV-01
    timeout.reconciliation: 120s
    resource.exclusions: |
      - apiGroups: ["cilium.io"]
        kinds: ["CiliumIdentity"]
        clusters: ["*"]
  rbac:
    policy.default: role:readonly
server:
  service:
    type: ClusterIP
controller:
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
repoServer:
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
dex:
  enabled: false
notifications:
  enabled: false
