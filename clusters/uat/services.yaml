# One Application per service that has envs/uat/<service>/values.yaml AND already has an image.digest (written by the gitops-promote pipeline).
# A service that has never been promoted (empty digest) gets no Application — the microservice chart refuses to render without a digest.
# goTemplate is not used, so the post-selector can filter on the flat `image.digest` key.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/viethung12062005/shp-gitops.git
        revision: main
        files:
          - path: envs/uat/*/values.yaml
      selector:
        matchExpressions:
          - { key: image.digest, operator: NotIn, values: [""] }
  template:
    metadata:
      name: "{{path.basename}}"
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: shp-apps
      sources:
        - repoURL: https://github.com/viethung12062005/shp-platform-templates.git
          targetRevision: main   # TODO CIT-09: pin tag chart-v0.1.0 once the chart is released
          path: charts/microservice
          helm:
            releaseName: "{{path.basename}}"
            valueFiles:
              - $values/envs/services-common.yaml
              - $values/envs/uat/services.yaml
              - $values/envs/uat/{{path.basename}}/values.yaml
            parameters:
              - { name: fullnameOverride, value: "{{path.basename}}" }
        - repoURL: https://github.com/viethung12062005/shp-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: shp-apps
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry: { limit: 3, backoff: { duration: 20s, factor: 2, maxDuration: 3m } }
