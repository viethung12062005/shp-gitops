# Argo CD permissions: platform add-ons and application services get separate projects; services may only deploy into namespace shp-apps.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform add-ons of the prod cluster (SA)
  sourceRepos:
    - https://github.com/viethung12062005/shp-gitops.git
    - https://charts.jetstack.io
    - https://kyverno.github.io/kyverno
    - https://argoproj.github.io/argo-helm
    - https://kedacore.github.io/charts
    - docker.io/envoyproxy
    - https://open-telemetry.github.io/opentelemetry-helm-charts
  destinations:
    - { server: https://kubernetes.default.svc, namespace: "*" }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shp-apps
  namespace: argocd
spec:
  description: The 8 application services of the prod cluster
  sourceRepos:
    - https://github.com/viethung12062005/shp-gitops.git
    - https://github.com/viethung12062005/shp-platform-templates.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: shp-apps }
  clusterResourceWhitelist: []          # services may not create cluster-scoped resources
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }
---
# Declares the public OCI registry of Envoy Gateway (no credential involved).
apiVersion: v1
kind: Secret
metadata:
  name: repo-envoyproxy-oci
  namespace: argocd
  labels: { argocd.argoproj.io/secret-type: repository }
stringData:
  name: envoyproxy
  type: helm
  url: docker.io/envoyproxy
  enableOCI: "true"
