# Platform add-ons (GOP-04..07), chart versions pinned. Values: platform/addons/<name>/values.yaml, per-environment overrides in
# envs/prod/addons/<name>.yaml (optional). Upgrading a version: change it here for uat first, prod afterwards.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { name: cert-manager, repoURL: "https://charts.jetstack.io", chart: cert-manager, version: "v1.21.2", namespace: cert-manager, wave: "-3" }
          - { name: kyverno, repoURL: "https://kyverno.github.io/kyverno", chart: kyverno, version: "3.9.1", namespace: kyverno, wave: "-3" }
          - { name: argo-rollouts, repoURL: "https://argoproj.github.io/argo-helm", chart: argo-rollouts, version: "2.43.7", namespace: argo-rollouts, wave: "-3" }
          - { name: keda, repoURL: "https://kedacore.github.io/charts", chart: keda, version: "2.20.2", namespace: keda, wave: "-3" }
          - { name: envoy-gateway, repoURL: "docker.io/envoyproxy", chart: gateway-helm, version: "1.9.3", namespace: envoy-gateway-system, wave: "-3" }
          - { name: opentelemetry-collector, repoURL: "https://open-telemetry.github.io/opentelemetry-helm-charts", chart: opentelemetry-collector, version: "0.177.0", namespace: observability, wave: "-3" }
          # Prometheus + Alertmanager for RED/SLO/platform alerts (OBS-01..03). Grafana stays disabled:
          # dashboards go to Azure Managed Grafana (IAC-06) or the local Grafana.
          - { name: kube-prometheus-stack, repoURL: "https://prometheus-community.github.io/helm-charts", chart: kube-prometheus-stack, version: "92.16.2", namespace: monitoring, wave: "-3" }
  template:
    metadata:
      name: "{{ .name }}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .wave }}"
    spec:
      project: platform
      sources:
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .version }}"
          helm:
            releaseName: "{{ .name }}"
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/platform/addons/{{ .name }}/values.yaml
              - $values/envs/prod/addons/{{ .name }}.yaml
        - repoURL: https://github.com/viethung12062005/shp-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
---
# Cluster foundation: namespace (PSA restricted), default-deny NetworkPolicy, Kyverno policies, Gateway + TLS. Local chart, runs after the add-ons.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shp-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: https://github.com/viethung12062005/shp-gitops.git
    targetRevision: main
    path: platform/charts/shp-baseline
    helm:
      valueFiles: [../../../envs/prod/platform.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: shp-apps
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }   # wait for the add-on CRDs to be ready
---
# MLflow tracking + model registry (GOP-10; ADR-0007, 16-mlops). Local chart; PostgreSQL backend store and Blob artifacts, both through
# Workload Identity. Lives in shp-deps like in the local profile, so the ml service reaches it at http://mlflow.shp-deps:5000.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/viethung12062005/shp-gitops.git
    targetRevision: main
    path: platform/charts/mlflow
    helm:
      valueFiles: [../../../envs/prod/addons/mlflow.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: shp-deps
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/warn: restricted
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
---
# Retraining of the no-show model (MLO-04; 16-mlops §5): CronJob with concurrencyPolicy Forbid that runs `python -m shp_ml.retrain`.
# Wave 1: after the services (wave 0), because it uses the `ml` ServiceAccount (and its Workload Identity) created by the ml service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-retrain
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/viethung12062005/shp-gitops.git
    targetRevision: main
    path: platform/charts/ml-retrain
    helm:
      valueFiles: [../../../envs/prod/addons/ml-retrain.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: shp-apps
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
---
# Dashboards and Prometheus rules owned by OBS-01..03. Applied after kube-prometheus-stack so the
# PrometheusRule CRD exists (sync-wave -3) and before the services (wave 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/viethung12062005/shp-gitops.git
    targetRevision: main
    path: platform/observability
    directory: { recurse: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
