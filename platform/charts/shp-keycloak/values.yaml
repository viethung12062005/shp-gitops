# Per-environment values live in envs/<env>/keycloak.yaml (FILL IN the empty fields from `terraform output keycloak_values`, IAC-16).
namespace: shp-iam
appsNamespace: shp-apps          # namespace of the shared Gateway; the /idp HTTPRoute lives there
replicaCount: 1                  # prod: 2 (ADR-0017); one Keycloak outage stops every sign-in

# Pinned by tag AND digest. Mirror to ACR is a follow-up (the Kyverno ACR policy only covers shp-apps).
image:
  repository: quay.io/keycloak/keycloak
  tag: "26.8.2"
  digest: sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0

# Public host of the platform, the same as gateway.hostname in envs/<env>/platform.yaml. Issuer = https://<hostname>/idp/realms/shp
hostname: ""

database:                        # IAC-16 output keycloak_values.database
  host: ""                       # FQDN of the IAM PostgreSQL server (resolves only inside the VNet)
  port: 5432
  name: keycloak
  username: keycloak
  egressCidr: 10.0.0.0/8         # private endpoint subnet (same convention as envs/services-common.yaml)

# Secrets: Key Vault through the Secrets Store CSI driver (never in this repo). The CSI volume is mounted by the pods and
# synced into the Kubernetes Secret named below, which the container reads as environment variables.
workloadIdentity:
  clientId: ""                   # IAC-16 output keycloak_values.workloadIdentity.clientId
keyVault:
  name: ""                       # IAC-16 output keycloak_values.keyVault.name
  tenantId: ""
  dbPasswordSecret: keycloak-db-password
  adminPasswordSecret: keycloak-admin-password
secret:
  name: keycloak-secrets         # synced Secret; keys: db-password, admin-password
  # false = do not create a SecretProviderClass; the Secret above must already exist (local kind test only).
  fromKeyVault: true

# Kubernetes service-account client authentication (IAM-02): Keycloak fetches the cluster's OIDC discovery/JWKS over HTTPS.
kubernetesClientAuth:
  egress: true                   # allow outbound 443 for that fetch (AKS OIDC issuer is public)

realm:
  importFile: files/realm-shp.json   # built by tools/identity/realm.py in the application repo; do not edit by hand

route:
  enabled: true                  # needs the Gateway API CRDs and the shp-gateway Gateway of shp-baseline
  gatewayName: shp-gateway
  tls: true                      # attach only to the https listener

networkPolicy:
  # Extra CIDRs that may reach Keycloak's port 8080 directly (an internal admin VPN/bastion range). Empty = nobody:
  # the admin console is then reachable only with `kubectl port-forward` (RBAC-controlled).
  adminCidrs: []

pdb: { enabled: true }
resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { memory: 1536Mi }
jvm:
  heap: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=50"
