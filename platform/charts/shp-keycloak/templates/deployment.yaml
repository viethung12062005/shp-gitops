{{- $h := .Values.hostname -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Values.namespace }}
  labels: {{- include "shp-keycloak.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "shp-keycloak.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shp-keycloak.labels" . | nindent 8 }}
        {{- if .Values.secret.fromKeyVault }}
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        # A realm change rolls the pods so the new import file is the one on disk.
        checksum/realm: {{ .Files.Get .Values.realm.importFile | sha256sum }}
        checksum/blacklist: {{ .Files.Get .Values.passwordBlacklist.file | sha256sum }}
    spec:
      serviceAccountName: keycloak
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "shp-keycloak.selector" . | nindent 14 }}
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ end }}"
          args:
            - start
            - --import-realm
            - --db=postgres
            - --db-url-host={{ required "database.host is required (terraform output keycloak_values)" .Values.database.host }}
            - --db-url-port={{ .Values.database.port }}
            - --db-url-database={{ .Values.database.name }}
            - --db-username={{ .Values.database.username }}
            # TLS ends at the Envoy Gateway; Keycloak serves plain HTTP inside the cluster and trusts X-Forwarded-*.
            - --http-enabled=true
            - --http-port=8080
            - --http-relative-path=/idp
            - --hostname=https://{{ required "hostname is required (gateway.hostname)" $h }}/idp
            - --proxy-headers=xforwarded
            - --health-enabled=true
            - --metrics-enabled=true
            - --cache=ispn
            - --cache-stack=kubernetes
          env:
            - { name: SHP_PUBLIC_HOST, value: {{ $h | quote }} }
            # Cluster realm placeholder ${SHP_K8S_OIDC_ISSUER}: identity provider `kubernetes` (service-account client authentication)
            - { name: SHP_K8S_OIDC_ISSUER, value: {{ required "kubernetesClientAuth.issuer is required (AKS oidc_issuer_url)" .Values.kubernetesClientAuth.issuer | quote }} }
            - { name: JAVA_OPTS_KC_HEAP, value: {{ .Values.jvm.heap | quote }} }
            # DNS_PING over the headless Service
            - { name: JAVA_OPTS_APPEND, value: "-Djgroups.dns.query=keycloak-headless.{{ .Values.namespace }}.svc.cluster.local" }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secret.name }}, key: admin-password } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secret.name }}, key: db-password } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
            - { name: jgroups, containerPort: 7800 }
          startupProbe:
            httpGet: { path: /idp/health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /idp/health/ready, port: management }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /idp/health/live, port: management }
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
            - { name: blacklist, mountPath: /opt/keycloak/data/password-blacklists, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.secret.fromKeyVault }}
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
            {{- end }}
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
        - name: blacklist
          configMap: { name: keycloak-password-blacklist }
        - name: tmp
          emptyDir: {}
        {{- if .Values.secret.fromKeyVault }}
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: keycloak }
        {{- end }}
