{{- if .Values.secret.fromKeyVault }}
# Key Vault -> mounted files -> Kubernetes Secret (read as env vars). The values never appear in git or in Helm output.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: keycloak
  namespace: {{ .Values.namespace }}
  labels: {{- include "shp-keycloak.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.keyVault.dbPasswordSecret }}
          objectType: secret
        - |
          objectName: {{ .Values.keyVault.adminPasswordSecret }}
          objectType: secret
  secretObjects:
    - secretName: {{ .Values.secret.name }}
      type: Opaque
      data:
        - { objectName: {{ .Values.keyVault.dbPasswordSecret }}, key: db-password }
        - { objectName: {{ .Values.keyVault.adminPasswordSecret }}, key: admin-password }
{{- end }}
