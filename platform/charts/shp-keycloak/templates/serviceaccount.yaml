apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: {{ .Values.namespace }}
  labels: {{- include "shp-keycloak.labels" . | nindent 4 }}
  {{- if .Values.secret.fromKeyVault }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required (terraform output keycloak_values)" .Values.workloadIdentity.clientId | quote }}
  {{- end }}
