apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Values.namespace }}
  labels: {{- include "shp-keycloak.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # IAM-06 (B2): keep the source address of a request that arrives through a node port or load balancer, so a request
  # never travels to another node (and loses its client address). The in-cluster path (ClusterIP from the Envoy data
  # plane) already keeps it because ClusterIP does not translate the source address.
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  selector: {{- include "shp-keycloak.selector" . | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Cluster discovery between replicas (JGroups DNS_PING). Includes pods that are not ready yet so a starting replica can join.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: {{ .Values.namespace }}
  labels: {{- include "shp-keycloak.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "shp-keycloak.selector" . | nindent 4 }}
  ports:
    - { name: jgroups, port: 7800, targetPort: jgroups }
