# Per-environment overrides live in envs/<env>/platform.yaml.
appsNamespace: shp-apps
# The only registry allowed for service images, for example acrshpab12cd.azurecr.io (the `acr_login_server` output of the bootstrap Terraform).
acrLoginServer: ""
policies:
  # Enforce: block; Audit: report only. GOP-07 requires Enforce in both uat and prod.
  action: Enforce
  # The keyless cosign signing identity is the container.yml reusable workflow of the templates repo.
  signerSubject: "https://github.com/viethung12062005/shp-platform-templates/.github/workflows/container.yml@*"
  signerIssuer: https://token.actions.githubusercontent.com
gateway:
  enabled: true
  hostname: ""              # e.g. api.uat.<domain>; when empty the Gateway only has an HTTP listener (no TLS)
  acmeEmail: ""             # address that receives Let's Encrypt notices (not patient data)
  acmeServer: https://acme-staging-v02.api.letsencrypt.org/directory
