apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.appsNamespace }}
  labels:
    # Pod Security Admission at restricted level (NFR-SEC7, GOP-08)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    shp.example.org/apps: "true"
---
# Deny all inbound traffic by default; each service opens exactly the sources it allows through networkPolicy.ingressFrom in its values.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.appsNamespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
