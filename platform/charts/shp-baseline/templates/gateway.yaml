{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway }}
# GOP-05: một Gateway chung; chỉ service `gateway` gắn HTTPRoute vào (values của nó: httpRoute.parentRefs).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shp-gateway
  namespace: {{ .Values.appsNamespace }}
  {{- if and $g.hostname $g.acmeEmail }}
  annotations: { cert-manager.io/cluster-issuer: letsencrypt }
  {{- end }}
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: { namespaces: { from: Same } }
    {{- if $g.hostname }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ $g.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs: [ { name: shp-gateway-tls } ]
      allowedRoutes: { namespaces: { from: Same } }
    {{- end }}
{{- if and $g.hostname $g.acmeEmail }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: {{ $g.acmeServer }}
    email: {{ $g.acmeEmail | quote }}
    privateKeySecretRef: { name: letsencrypt-account }
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs: [ { name: shp-gateway, namespace: {{ .Values.appsNamespace }}, kind: Gateway } ]
{{- end }}
{{- end }}
