{{- $ns := .Values.appsNamespace -}}
{{- $p := .Values.policies -}}
{{- if not .Values.acrLoginServer }}{{ fail "acrLoginServer is required (envs/<env>/platform.yaml)" }}{{ end }}
# GOP-07: images only from ACR and signed by the pipeline; :latest banned; resources and probes required. Applied to application namespaces only.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: shp-restrict-registry
  annotations: { policies.kyverno.io/title: "Images from the project ACR only" }
spec:
  validationFailureAction: {{ $p.action }}
  background: true
  rules:
    - name: only-acr
      match: { any: [ { resources: { kinds: [Pod], namespaces: [{{ $ns }}] } } ] }
      validate:
        message: "The image must come from {{ .Values.acrLoginServer }}"
        pattern:
          spec:
            =(initContainers): [ { image: "{{ .Values.acrLoginServer }}/*" } ]
            containers: [ { image: "{{ .Values.acrLoginServer }}/*" } ]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: shp-verify-signature
  annotations: { policies.kyverno.io/title: "The image must be signed by the pipeline (cosign keyless)" }
spec:
  validationFailureAction: {{ $p.action }}
  webhookTimeoutSeconds: 30
  rules:
    - name: cosign-keyless
      match: { any: [ { resources: { kinds: [Pod], namespaces: [{{ $ns }}] } } ] }
      verifyImages:
        - imageReferences: ["{{ .Values.acrLoginServer }}/*"]
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    subject: "{{ $p.signerSubject }}"
                    issuer: "{{ $p.signerIssuer }}"
                    rekor: { url: https://rekor.sigstore.dev }
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: shp-disallow-latest
spec:
  validationFailureAction: {{ $p.action }}
  background: true
  rules:
    - name: no-latest-tag
      match: { any: [ { resources: { kinds: [Pod], namespaces: [{{ $ns }}] } } ] }
      validate:
        message: "Do not use the :latest tag; deploy by digest"
        pattern:
          spec:
            containers: [ { image: "!*:latest" } ]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: shp-require-resources-probes
spec:
  validationFailureAction: {{ $p.action }}
  background: true
  rules:
    - name: resources-and-probes
      match: { any: [ { resources: { kinds: [Pod], namespaces: [{{ $ns }}] } } ] }
      validate:
        message: "The container must set cpu and memory requests, a memory limit, a readinessProbe and a livenessProbe"
        pattern:
          spec:
            containers:
              - resources:
                  requests: { cpu: "?*", memory: "?*" }
                  limits: { memory: "?*" }
                readinessProbe: { httpGet: { path: "?*" } }
                livenessProbe: { httpGet: { path: "?*" } }
