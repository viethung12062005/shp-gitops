{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mlflow
  namespace: {{ .Values.namespace }}
  labels: {{- include "mlflow.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "mlflow.selector" . | nindent 6 }}
{{- end }}
