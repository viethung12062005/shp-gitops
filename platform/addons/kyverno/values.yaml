# Policy nằm ở platform/charts/shp-baseline (GOP-07). Kyverno không tự kiểm namespace hệ thống.
admissionController:
  replicas: 3
  container: { resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } } }
backgroundController: { resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } } }
cleanupController: { enabled: false }
reportsController: { resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } } }
config:
  webhooks:
    - namespaceSelector:
        matchExpressions:
          - { key: kubernetes.io/metadata.name, operator: NotIn, values: [kube-system, kyverno, argocd] }
