# In-cluster Prometheus + Alertmanager for SLO and platform alerting (OBS-01..03).
#
# Grafana is disabled on purpose: uat/prod show dashboards in Azure Managed Grafana (IAC-06) and the
# local profile (dev/chart/shp-local-full) runs its own Grafana. The dashboards in
# platform/observability/dashboards/ are the source of truth imported there; they carry the
# `grafana_dashboard: "1"` label, so a Grafana with the dashboard sidecar picks them up unchanged.
#
# The existing Argo Rollouts AnalysisTemplate (MLO-03, envs/<env>/ml/values.yaml) already queries
# http://prometheus.monitoring:9090. kube-prometheus-stack names its own Service
# `<release>-prometheus`, so platform/observability/prometheus-service.yaml adds the stable
# `prometheus` Service; the StatefulSet keeps the operator's default governing service.
crds:
  enabled: true

# AKS manages the control plane: etcd, controller-manager, scheduler and kube-proxy are not
# reachable from the cluster, so the default scrape targets would stay down forever.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

grafana:
  enabled: false

alertmanager:
  enabled: true
  # Routing (MLO-05). The chart default (everything to the `null` receiver) is kept for every alert except the
  # ones labelled `team: ml` by platform/observability/rules/mlops-alerts.yaml, which go to `ml-owner`.
  # `ml-owner` is a PLACEHOLDER: it has no integration yet, so those alerts are grouped and visible in the
  # Alertmanager UI/API but notify nobody. No webhook URL or secret is stored in this repository.
  # To turn it on (ENV-01, per environment):
  #   1. Store the channel's webhook URL in Key Vault as a secret (for example `ml-alert-webhook-url`).
  #   2. Sync it to a Secret `alertmanager-ml-webhook` in namespace `monitoring` (Key Vault CSI driver with
  #      Workload Identity, a SecretProviderClass with secretObjects), key `url`.
  #   3. In envs/<env>/addons/kube-prometheus-stack.yaml set
  #        alertmanager.alertmanagerSpec.secrets: [alertmanager-ml-webhook]
  #      and add to the `ml-owner` receiver below
  #        webhook_configs: [{ url_file: /etc/alertmanager/secrets/alertmanager-ml-webhook/url, send_resolved: true }]
  #      (a Slack/Teams/e-mail receiver works the same way: use its `*_file` field). Do both in one PR: the
  #      Alertmanager pod does not start if `secrets` names a Secret that does not exist.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        # The model signals are daily gauges: group by alertname only and repeat once a day.
        - receiver: ml-owner
          matchers:
            - team = "ml"
          group_by: ['alertname']
          repeat_interval: 24h
    receivers:
      - name: 'null'
      - name: ml-owner
    templates:
      - '/etc/alertmanager/config/*.tmpl'
  alertmanagerSpec:
    replicas: 1
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

kubeStateMetrics:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }

nodeExporter:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 64Mi }

prometheus:
  prometheusSpec:
    replicas: 1
    # NFR-A1 is a monthly SLO: keep a full 30-day window so the error-budget dashboard can query it.
    retention: 30d
    retentionSize: 4GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Load every PrometheusRule in the cluster (OBS-02 and OBS-03 add theirs under
    # platform/observability/rules/), not only the ones labelled by this Helm release.
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1Gi }
    additionalScrapeConfigs:
      # RED metrics of the six Spring Boot services. The chart labels every pod with
      # app.kubernetes.io/instance=<release name>, and the services ApplicationSet sets the release
      # name to the service name, so that label becomes the `service` label in every dashboard/rule.
      - job_name: shp-apps-java
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [shp-apps] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            regex: gateway|scheduling|clinical|document|notification|audit
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "8080"
            action: keep
          - source_labels: [__address__, __meta_kubernetes_pod_container_port_number]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - target_label: __metrics_path__
            replacement: /prometheus
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # RED metrics of the two FastAPI services (prometheus_client exposes /metrics).
      - job_name: shp-apps-python
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [shp-apps] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            regex: ai|ml
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "8080"
            action: keep
          - source_labels: [__address__, __meta_kubernetes_pod_container_port_number]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - target_label: __metrics_path__
            replacement: /metrics
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # cert-manager controller metrics (certmanager_certificate_*) for OBS-03 certificate alerts.
      - job_name: cert-manager
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [cert-manager] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9402"
            action: keep
          - source_labels: [__address__, __meta_kubernetes_pod_container_port_number]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # RabbitMQ dead-letter queues (OBS-03). Active only where the RabbitMQ prometheus plugin or
      # rabbitmq-exporter exposes port 15692; cloud environments use Azure Service Bus, whose DLQ
      # alert is an Azure Monitor metric alert in shp-infra/modules/servicebus.
      - job_name: rabbitmq
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [shp-deps] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "15692"
            action: keep
          - source_labels: [__address__, __meta_kubernetes_pod_container_port_number]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # Argo CD application controller and API server metrics (argocd_app_info) for OBS-03.
      - job_name: argocd-application-controller
        static_configs:
          - targets: [argocd-metrics.argocd.svc:8082]
      - job_name: argocd-server
        static_configs:
          - targets: [argocd-server-metrics.argocd.svc:8083]
