# KEDA: scale on a schedule or a queue (PRD-11). Authenticates to Service Bus with Workload Identity.
podIdentity:
  azureWorkload: { enabled: true }
resources:
  operator: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
  metricServer: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
