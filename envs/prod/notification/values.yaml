# Values for notification in prod. image.digest is written by the svc-notification pipeline (gitops-promote) — DO NOT edit by hand.
# The Application is only created once the digest is non-empty (clusters/prod/services.yaml).
image:
  repository: ""            # <acrLoginServer>/notification — fill in together with envs/prod/platform.yaml
  digest: ""
env:
  OTEL_SERVICE_NAME: notification
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }   # JVM: -XX:MaxRAMPercentage=75
