# Values for ml in prod. image.digest is written by the svc-ml pipeline (gitops-promote) — DO NOT edit by hand.
# The Application is only created once the digest is non-empty (clusters/prod/services.yaml).
image:
  repository: ""            # <acrLoginServer>/ml — fill in together with envs/prod/platform.yaml
  digest: ""
env:
  OTEL_SERVICE_NAME: ml
  # Model canary (MLO-03, 16-mlops section 6): the registry version these pods serve. Changing it is a pod template
  # change, so Argo Rollouts canaries the new MODEL below exactly like a new image: canary pods serve the new version,
  # stable pods keep the old one and shadow the candidate (paired score PSI and agreement, ML-25). Abort = old model.
  # Written by the model promotion (MLO-01) like image.digest; set it to the version of the `candidate` alias.
  # Empty = follow the `production` alias (no model canary possible).
  SERVING_MODEL_VERSION: ""

# Automatic canary for the no-show service (MLO-03; 16-mlops section 6), for a new image OR a new model version
# (SERVING_MODEL_VERSION above). Inside each pod the shadow (ML-24) keeps scoring the `candidate` alias; the canary
# below is what moves real traffic to a new model.
rollout:
  enabled: true
  # autoPromote=false in prod (GOP-09): the empty `pause: {}` step below holds the Rollout before 100% until an
  # operator promotes it (`kubectl argo rollouts promote ml`, or the GitHub Environment approval). UAT sets
  # autoPromote=true by omitting that step (envs/uat/ml/values.yaml). Argo Rollouts has no separate autoPromote
  # field: the presence or absence of the indefinite pause is the per-environment switch. To let prod run through
  # by itself again (the MLO-03 behavior), delete the `pause: {}` step.
  steps:
    - setWeight: 10
    # The strategy-level analysis below starts at startingStep: 1 (this pause) and runs in the background for
    # count*interval. It does not block promotion, but a failure aborts the Rollout and returns traffic to stable.
    - pause: { duration: 30m }
    - setWeight: 50
    # 50% has its own inline analysis: a blocking AnalysisRun with the same template and metrics, so the bad-model
    # gate runs at 50% too (16-mlops §6: "AnalysisTemplate passes within 30 minutes" per step). count*interval
    # below = 30 minutes. Any metric violation fails the run and rolls the Rollout back automatically.
    - analysis:
        templates:
          - templateName: ml     # fullnameOverride=ml, set by clusters/prod/services.yaml
        args:
          - name: canary-hash
            valueFrom: { podTemplateHashValue: Latest }
          - name: stable-hash
            valueFrom: { podTemplateHashValue: Stable }
    - pause: {}                  # manual promotion gate before 100% (autoPromote=false)
    - setWeight: 100
  analysis:
    enabled: true
    compareCanaryStable: true   # requires the canary-hash/stable-hash args in the microservice chart (MLO-03, templates PR #6)
    prometheusAddress: http://prometheus.monitoring:9090   # Managed Prometheus; confirm once OBS-04 is done
    interval: 5m
    count: 6                  # 6 × 5 minutes = 30 minutes per step, matching the table in 16-mlops §6
    # The scrape job shp-apps-python copies the pod label `rollouts-pod-template-hash` to `rollouts_pod_template_hash`
    # (platform/addons/kube-prometheus-stack/values.yaml); every query below selects canary and stable pods by it.
    metrics:
      # Any violation fails the AnalysisRun (failureLimit: 0, set in the chart) and Argo Rollouts aborts: traffic goes
      # back to the stable pods, which still serve the old model version.
      - name: error-rate-vs-baseline
        # canary error rate <= stable error rate + 0.5 percentage points; error rate = errors / (errors + successes)
        query: |
          (
            sum(rate(shp_ml_predict_errors_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[5m]))
            /
            clamp_min(sum(rate(shp_ml_predict_errors_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[5m]))
              + sum(rate(shp_ml_predict_seconds_count{rollouts_pod_template_hash="{{args.canary-hash}}"}[5m])), 1e-9)
          )
          -
          (
            sum(rate(shp_ml_predict_errors_total{rollouts_pod_template_hash="{{args.stable-hash}}"}[5m]))
            /
            clamp_min(sum(rate(shp_ml_predict_errors_total{rollouts_pod_template_hash="{{args.stable-hash}}"}[5m]))
              + sum(rate(shp_ml_predict_seconds_count{rollouts_pod_template_hash="{{args.stable-hash}}"}[5m])), 1e-9)
          )
        successCondition: "result[0] <= 0.005"
      - name: predict-latency-p95
        # p95 prediction latency of the canary <= 100 ms (M3, NFR)
        query: |
          histogram_quantile(0.95,
            sum(rate(shp_ml_predict_seconds_bucket{rollouts_pod_template_hash="{{args.canary-hash}}"}[5m])) by (le)
          )
        successCondition: "result[0] <= 0.1"
      - name: score-psi-vs-stable
        # Score PSI of the canary's model against the stable model, on the same appointments: the stable pods shadow the
        # candidate and export shp_ml_shadow_score_psi (ML-25). Selected for the version the canary serves
        # (shp_ml_model_info of the canary pods). An image-only canary (same model version on both sides) returns 0.
        # A model canary without that series yet returns nothing, which errors the measurement: no evidence, no promotion.
        query: |
          max(
            shp_ml_shadow_score_psi{rollouts_pod_template_hash="{{args.stable-hash}}"}
            * on(model_version) group_left()
            max by (model_version) (shp_ml_model_info{role="production", rollouts_pod_template_hash="{{args.canary-hash}}"})
          )
          or
          (vector(0) unless on() (
            max by (model_version) (shp_ml_model_info{role="production", rollouts_pod_template_hash="{{args.canary-hash}}"})
            unless on(model_version)
            max by (model_version) (shp_ml_model_info{role="production", rollouts_pod_template_hash="{{args.stable-hash}}"})
          ))
        successCondition: "result[0] < 0.1"
      - name: agreement-vs-stable
        # highRisk agreement of the canary's model with the stable model on the same appointments >= 90% (shadow in the
        # stable pods, shp_ml_shadow_agreement_total). Same selection and image-only rule as score-psi-vs-stable.
        query: |
          max(
            (
              sum by (model_version) (rate(shp_ml_shadow_agreement_total{agree="true", rollouts_pod_template_hash="{{args.stable-hash}}"}[10m]))
              /
              sum by (model_version) (rate(shp_ml_shadow_agreement_total{rollouts_pod_template_hash="{{args.stable-hash}}"}[10m]))
            )
            * on(model_version) group_left()
            max by (model_version) (shp_ml_model_info{role="production", rollouts_pod_template_hash="{{args.canary-hash}}"})
          )
          or
          (vector(1) unless on() (
            max by (model_version) (shp_ml_model_info{role="production", rollouts_pod_template_hash="{{args.canary-hash}}"})
            unless on(model_version)
            max by (model_version) (shp_ml_model_info{role="production", rollouts_pod_template_hash="{{args.stable-hash}}"})
          ))
        successCondition: "result[0] >= 0.9"
      - name: high-risk-rate-stability
        # the highRisk rate of the canary stays within ±5 percentage points of the stable pods
        query: |
          (
            sum(rate(shp_ml_high_risk_total{high_risk="true", rollouts_pod_template_hash="{{args.canary-hash}}"}[10m]))
            /
            clamp_min(sum(rate(shp_ml_high_risk_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[10m])), 1e-9)
          )
          -
          (
            sum(rate(shp_ml_high_risk_total{high_risk="true", rollouts_pod_template_hash="{{args.stable-hash}}"}[10m]))
            /
            clamp_min(sum(rate(shp_ml_high_risk_total{rollouts_pod_template_hash="{{args.stable-hash}}"}[10m])), 1e-9)
          )
        successCondition: "result[0] >= -0.05 && result[0] <= 0.05"
