# Values for ml in prod. image.digest is written by the svc-ml pipeline (gitops-promote) — DO NOT edit by hand.
# The Application is only created once the digest is non-empty (clusters/prod/services.yaml).
image:
  repository: ""            # <acrLoginServer>/ml — fill in together with envs/prod/platform.yaml
  digest: ""
env:
  OTEL_SERVICE_NAME: ml

# Automatic canary for the no-show model (MLO-03; 16-mlops §6). This is a canary at the INFRASTRUCTURE level (the share of prediction traffic
# that goes to pods running the new image) — different from the shadow/canary model (ML-24, ML-07), which runs INSIDE each pod through
# the registry's candidate/production aliases. The two layers are independent: changing the image (here) does not change the model alias, and vice versa.
rollout:
  enabled: true
  steps:
    - setWeight: 10
    - pause: { duration: 30m }   # long enough for the analysis below to finish count*interval at 10%
    - setWeight: 50
    - pause: { duration: 30m }   # long enough for the analysis to finish count*interval at 50%
    # autoPromote=true (the prod default, per 16-mlops §6: fake data, low risk): there is no final pause step,
    # the Rollout goes to 100% by itself when the 50% step passes. To wait for approval (GitHub Environment) before 100%, add:
    #   - pause: {}   # indefinite; release it with `kubectl argo rollouts promote ml`
  analysis:
    enabled: true
    compareCanaryStable: true   # requires the canary-hash/stable-hash args in the microservice chart (MLO-03, templates PR #6)
    prometheusAddress: http://prometheus.monitoring:9090   # Managed Prometheus; confirm once OBS-04 is done
    interval: 5m
    count: 6                  # 6 × 5 minutes = 30 minutes per step, matching the table in 16-mlops §6
    # Assumption: the scrape config attaches the Prometheus label `rollouts_pod_template_hash` from the pod label
    # `rollouts-pod-template-hash` (relabel __meta_kubernetes_pod_label_rollouts_pod_template_hash) — configure this when
    # OBS-04 sets up Managed Prometheus; without that label, the two versus-stable metrics below query nothing.
    metrics:
      # Any metric violation → Argo Rollouts rolls back to the previous version by itself (failureLimit: 0, set in the chart).
      - name: error-rate-vs-baseline
        # error rate <= previous version (canary-hash=stable) + 0.5 percentage points
        query: |
          (
            sum(rate(shp_ml_predict_errors_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[5m]))
            /
            clamp_min(sum(rate(shp_ml_predict_seconds_count{rollouts_pod_template_hash="{{args.canary-hash}}"}[5m])), 1)
          )
          -
          (
            sum(rate(shp_ml_predict_errors_total{rollouts_pod_template_hash="{{args.stable-hash}}"}[5m]))
            /
            clamp_min(sum(rate(shp_ml_predict_seconds_count{rollouts_pod_template_hash="{{args.stable-hash}}"}[5m])), 1)
          )
        successCondition: "result[0] <= 0.005"
      - name: predict-latency-p95
        # p95 prediction latency <= 100 ms (M3, NFR)
        query: |
          histogram_quantile(0.95,
            sum(rate(shp_ml_predict_seconds_bucket{rollouts_pod_template_hash="{{args.canary-hash}}"}[5m])) by (le)
          )
        successCondition: "result[0] <= 0.1"
      - name: score-psi
        # PSI of prediction scores between candidate (shadow, ML-24) and production < 0.1 — measured inside the pod, not per hash
        query: "max(shp_ml_score_psi)"
        successCondition: "result[0] < 0.1"
      - name: high-risk-rate-stability
        # the highRisk rate of the new version stays within ±5 percentage points of the previous version
        query: |
          (
            sum(rate(shp_ml_high_risk_total{high_risk="true", rollouts_pod_template_hash="{{args.canary-hash}}"}[10m]))
            /
            clamp_min(sum(rate(shp_ml_high_risk_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[10m])), 1)
          )
          -
          (
            sum(rate(shp_ml_high_risk_total{high_risk="true", rollouts_pod_template_hash="{{args.stable-hash}}"}[10m]))
            /
            clamp_min(sum(rate(shp_ml_high_risk_total{rollouts_pod_template_hash="{{args.stable-hash}}"}[10m])), 1)
          )
        successCondition: "result[0] >= -0.05 && result[0] <= 0.05"
