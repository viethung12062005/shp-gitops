# Values của scheduling ở prod. image.digest do pipeline svc-scheduling (gitops-promote) ghi — KHÔNG sửa tay.
# Application chỉ được tạo khi digest khác rỗng (clusters/prod/services.yaml).
image:
  repository: ""            # <acrLoginServer>/scheduling — điền cùng lúc với envs/prod/platform.yaml
  digest: ""
# Đăng nhập PostgreSQL bằng token Entra của Workload Identity, không mật khẩu (server tắt password auth;
# smart-hospital-platform: docs/03-architecture/detailed-design/02-db-scheduling.md §5). ĐIỀN từ output Terraform của shp-infra/envs/prod.
serviceAccount:
  name: scheduling          # khớp federated credential system:serviceaccount:<namespace>:scheduling (shp-infra/modules/workload-identity)
workloadIdentity:
  enabled: true
  clientId: ""              # ĐIỀN: output workload_identity_client_ids["scheduling"]
env:
  OTEL_SERVICE_NAME: scheduling
  # ĐIỀN: jdbc:postgresql://<output postgres_fqdn>:5432/scheduling?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_USERNAME: ""  # ĐIỀN: output workload_identity_names["scheduling"] (id-<prefix>-scheduling); principal tạo theo shp-infra/modules/postgres/README.md
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }   # JVM: -XX:MaxRAMPercentage=75
