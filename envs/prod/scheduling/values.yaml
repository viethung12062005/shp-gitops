# Values for scheduling in prod. image.digest is written by the svc-scheduling pipeline (gitops-promote) — DO NOT edit by hand.
# The Application is only created once the digest is non-empty (clusters/prod/services.yaml).
image:
  repository: ""            # <acrLoginServer>/scheduling — fill in together with envs/prod/platform.yaml
  digest: ""
# PostgreSQL sign-in uses an Entra token from Workload Identity, no password (the server has password auth turned off;
# smart-hospital-platform: docs/03-architecture/detailed-design/02-db-scheduling.md §5). FILL IN from the Terraform output of shp-infra/envs/prod.
serviceAccount:
  name: scheduling          # matches the federated credential system:serviceaccount:<namespace>:scheduling (shp-infra/modules/workload-identity)
workloadIdentity:
  enabled: true
  clientId: ""              # FILL IN: output workload_identity_client_ids["scheduling"]
env:
  OTEL_SERVICE_NAME: scheduling
  # FILL IN: jdbc:postgresql://<output postgres_fqdn>:5432/scheduling?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_USERNAME: ""  # FILL IN: output workload_identity_names["scheduling"] (id-<prefix>-scheduling); the principal is created per shp-infra/modules/postgres/README.md
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }   # JVM: -XX:MaxRAMPercentage=75
