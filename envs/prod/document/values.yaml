# Values của document ở prod. image.digest do pipeline svc-document (gitops-promote) ghi — KHÔNG sửa tay.
# Application chỉ được tạo khi digest khác rỗng (clusters/prod/services.yaml).
image:
  repository: ""            # <acrLoginServer>/document — điền cùng lúc với envs/prod/platform.yaml
  digest: ""
env:
  OTEL_SERVICE_NAME: document
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }   # JVM: -XX:MaxRAMPercentage=75
