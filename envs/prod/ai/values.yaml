# Values for ai in prod. image.digest is written by the svc-ai pipeline (gitops-promote) — DO NOT edit by hand.
# The Application is only created once the digest is non-empty (clusters/prod/services.yaml).
image:
  repository: ""            # <acrLoginServer>/ai — fill in together with envs/prod/platform.yaml
  digest: ""
env:
  OTEL_SERVICE_NAME: ai
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { memory: 1Gi }

networkPolicy:
  enabled: true
  # Ingress unchanged: same namespace only (set in envs/services-common.yaml).
  ingressFrom:
    - podSelector: {}
  # Helm REPLACES the shared egress list, so this file repeats it and adds the one rule the design allows for
  # this service: HTTPS to the public internet (10-network-trust-zones Z4).
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: shp-deps } }
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 27017, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 5672, protocol: TCP }
        - { port: 8080, protocol: TCP }
        - { port: 10000, protocol: TCP }
        - { port: 10001, protocol: TCP }
        - { port: 9200, protocol: TCP }
        - { port: 5000, protocol: TCP }
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
    # Z4: LLM providers (DeepSeek, Gemini) are external APIs
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 443, protocol: TCP }
