# Values shared by EVERY service in EVERY environment (loaded before envs/<env>/services.yaml and
# envs/<env>/<svc>/values.yaml). The chart's safe defaults stay; this file adds only what the project needs.
env:
  SHP_OTLP_EXPORT: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.observability:4318
  SHP_CLINICAL_URL: http://clinical
  # Signing keys are fetched inside the cluster (the public issuer URL is not reachable from a pod under default-deny egress).
  # OIDC_AUTHORITY (the public /idp issuer) is per environment in envs/<env>/services.yaml.
  OIDC_JWK_SET_URI: http://keycloak.shp-iam.svc.cluster.local:8080/idp/realms/shp/protocol/openid-connect/certs
  SHP_AUTH_JWK_SET_URI: http://keycloak.shp-iam.svc.cluster.local:8080/idp/realms/shp/protocol/openid-connect/certs
  # RED metrics (OBS-01) and the SLO boundaries (OBS-02): Micrometer publishes the latency histogram,
  # and the exact 300 ms / 800 ms buckets that platform/observability/rules/red-slo.yaml uses.
  # Spring Boot reads SPRING_APPLICATION_JSON; non-Java services ignore it.
  SPRING_APPLICATION_JSON: '{"management":{"metrics":{"distribution":{"percentiles-histogram":{"http.server.requests":true},"slo":{"http.server.requests":"300ms,800ms"}}}}}'
networkPolicy:
  enabled: true
  # Ingress: only from pods in the same namespace (gateway -> service, service -> service on /internal).
  ingressFrom:
    - podSelector: {}
  # Egress (GOP-08, 10-network-trust-zones Z2/Z3): default-deny outbound, then open only what a service needs.
  # Without this a compromised pod can reach anything the node can — the audit found egress unrestricted.
  egress:
    # DNS, or every name lookup fails.
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # Same namespace: gateway -> service, /internal calls, OTel collector.
    - to:
        - podSelector: {}
    # Managed dependencies in shp-deps (PostgreSQL, MongoDB, Redis, RabbitMQ, Keycloak, Azurite, search, MLflow).
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: shp-deps } }
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 27017, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 5672, protocol: TCP }
        - { port: 8080, protocol: TCP }
        - { port: 10000, protocol: TCP }
        - { port: 10001, protocol: TCP }
        - { port: 9200, protocol: TCP }
        - { port: 5000, protocol: TCP }
    # Keycloak (shp-iam): token signing keys only (JWKS). Keycloak's NetworkPolicy admits shp-apps on 8080 and nothing else.
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: shp-iam } }
      ports:
        - { port: 8080, protocol: TCP }
    # Private endpoints and in-VNet Azure services (Service Bus, Key Vault, Blob, AI Search, Monitor) all sit in the
    # VNet; 10/8 covers the cluster and private-endpoint subnets without naming each CIDR here.
    - to:
        - ipBlock: { cidr: 10.0.0.0/8 }
    # NOTE: no rule for the public internet here. Only `ai` (LLM providers) and `notification` (push/SMS/email)
    # add `0.0.0.0/0:443` in their own values files — that is the Z4 egress the design allows.
