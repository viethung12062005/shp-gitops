# Values shared by EVERY service in EVERY environment (loaded before envs/<env>/services.yaml and envs/<env>/<svc>/values.yaml).
# The chart's safe defaults stay as they are; only project-specific settings are added here.
env:
  SHP_OTLP_EXPORT: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.observability:4318
  SHP_CLINICAL_URL: http://clinical
networkPolicy:
  enabled: true
  # Default: accept only from pods in the same namespace (gateway → service, service-to-service calls to /internal).
  ingressFrom:
    - podSelector: {}
