# ai values for uat. image.digest is written by the svc-ai pipeline (gitops-promote) — do not edit by hand.
# The Application is created only when the digest is non-empty (clusters/uat/services.yaml).
image:
  repository: ""            # <acrLoginServer>/ai — filled together with envs/uat/platform.yaml
  digest: ""
# SCF-06: ai runs on the dedicated node pool (shp-infra modules/aks labels it shp/pool=ai and taints it
# workload=ai:NoSchedule), so the model host cannot be scheduled onto the general app nodes.
nodeSelector:
  shp/pool: ai
tolerations:
  - key: workload
    operator: Equal
    value: ai
    effect: NoSchedule
env:
  OTEL_SERVICE_NAME: ai
resources:
  requests: { cpu: 200m, memory: 512Mi }
  # bge-m3 + qwen2.5-7b live in this pod; the node pool is sized ~8-10 GB (ADR-0013).
  limits: { memory: 8Gi }
