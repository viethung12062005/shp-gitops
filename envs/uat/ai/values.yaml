# Values for ai in uat. image.digest is written by the svc-ai pipeline (gitops-promote) — DO NOT edit by hand.
# The Application is only created once the digest is non-empty (clusters/uat/services.yaml).
image:
  repository: ""            # <acrLoginServer>/ai — fill in together with envs/uat/platform.yaml
  digest: ""
env:
  OTEL_SERVICE_NAME: ai
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { memory: 1Gi }
