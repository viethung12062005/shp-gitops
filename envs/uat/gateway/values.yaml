# Values của gateway ở uat. image.digest do pipeline svc-gateway (gitops-promote) ghi — KHÔNG sửa tay.
# Application chỉ được tạo khi digest khác rỗng (clusters/uat/services.yaml).
image:
  repository: ""            # <acrLoginServer>/gateway — điền cùng lúc với envs/uat/platform.yaml
  digest: ""
env:
  OTEL_SERVICE_NAME: gateway
httpRoute:
  enabled: true
  parentRefs: [ { name: shp-gateway } ]
  pathPrefixes: [/fhir, /api]   # the web app (envs/<env>/web) serves everything else, including /
networkPolicy:
  ingressFrom:
    # Envoy proxy chạy ở namespace envoy-gateway-system
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system } }
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }   # JVM: -XX:MaxRAMPercentage=75
