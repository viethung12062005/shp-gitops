# Values for gateway in uat. image.digest is written by the svc-gateway pipeline (gitops-promote) — DO NOT edit by hand.
# The Application is only created once the digest is non-empty (clusters/uat/services.yaml).
image:
  repository: ""            # <acrLoginServer>/gateway — fill in together with envs/uat/platform.yaml
  digest: ""
env:
  OTEL_SERVICE_NAME: gateway
httpRoute:
  enabled: true
  parentRefs: [ { name: shp-gateway } ]
  pathPrefixes: [/fhir, /api]   # the web app (envs/<env>/web) serves everything else, including /
networkPolicy:
  ingressFrom:
    # The Envoy proxy runs in namespace envoy-gateway-system
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system } }
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }   # JVM: -XX:MaxRAMPercentage=75
