# Values for ml in uat. image.digest is written by the svc-ml pipeline (gitops-promote) — DO NOT edit by hand.
# The Application is only created once the digest is non-empty (clusters/uat/services.yaml).
image:
  repository: ""            # <acrLoginServer>/ml — fill in together with envs/uat/platform.yaml
  digest: ""
env:
  OTEL_SERVICE_NAME: ml

# A lighter canary than prod (MLO-03): less traffic, so the analysis is shorter and autoPromote is always true (16-mlops §6: uat/local).
# Same note as in envs/prod/ml/values.yaml about the infrastructure-level canary (image change) versus the shadow/canary model (ML-24).
rollout:
  enabled: true
  steps:
    - setWeight: 20
    - pause: { duration: 5m }
    - setWeight: 100
  analysis:
    enabled: true
    compareCanaryStable: true
    prometheusAddress: http://prometheus.monitoring:9090
    interval: 1m
    count: 5
    metrics:
      - name: error-rate-vs-baseline
        query: |
          (
            sum(rate(shp_ml_predict_errors_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))
            /
            clamp_min(sum(rate(shp_ml_predict_seconds_count{rollouts_pod_template_hash="{{args.canary-hash}}"}[1m])), 1)
          )
          -
          (
            sum(rate(shp_ml_predict_errors_total{rollouts_pod_template_hash="{{args.stable-hash}}"}[1m]))
            /
            clamp_min(sum(rate(shp_ml_predict_seconds_count{rollouts_pod_template_hash="{{args.stable-hash}}"}[1m])), 1)
          )
        successCondition: "result[0] <= 0.005"
      - name: predict-latency-p95
        query: |
          histogram_quantile(0.95,
            sum(rate(shp_ml_predict_seconds_bucket{rollouts_pod_template_hash="{{args.canary-hash}}"}[1m])) by (le)
          )
        successCondition: "result[0] <= 0.1"
