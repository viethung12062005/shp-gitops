# Values shared by every service in the uat cluster. FILL IN the empty fields before provisioning (none of them is a secret).
env:
  OIDC_AUTHORITY: ""        # Keycloak (ADR-0017): https://<gateway.hostname>/idp/realms/shp
  OIDC_AUDIENCE: ""         # API audience in the Keycloak realm: shp-api
  SHP_REQUIRE_MFA_FOR_STAFF: "true"
replicaCount: 1
pdb:
  enabled: false
