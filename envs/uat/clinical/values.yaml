# Values for clinical in uat. image.digest is written by the svc-clinical pipeline (gitops-promote) — DO NOT edit by hand.
# The Application is only created once the digest is non-empty (clusters/uat/services.yaml).
image:
  repository: ""            # <acrLoginServer>/clinical — fill in together with envs/uat/platform.yaml
  digest: ""
env:
  OTEL_SERVICE_NAME: clinical
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }   # JVM: -XX:MaxRAMPercentage=75
