# Values của notification ở uat. image.digest do pipeline svc-notification (gitops-promote) ghi — KHÔNG sửa tay.
# Application chỉ được tạo khi digest khác rỗng (clusters/uat/services.yaml).
image:
  repository: ""            # <acrLoginServer>/notification — điền cùng lúc với envs/uat/platform.yaml
  digest: ""
env:
  OTEL_SERVICE_NAME: notification
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }   # JVM: -XX:MaxRAMPercentage=75
