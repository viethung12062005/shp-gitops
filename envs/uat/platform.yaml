# Values of the base chart platform/charts/shp-baseline for the uat cluster.
# FILL IN before provisioning the environment (not secrets; taken from Terraform outputs): tools/validate.sh fails if any is still empty with --strict.
acrLoginServer: ""          # acr_login_server output of shp-infra/bootstrap, e.g. acrshpab12cd.azurecr.io
gateway:
  hostname: ""              # e.g. api.uat.<domain>
  acmeEmail: ""
  acmeServer: https://acme-staging-v02.api.letsencrypt.org/directory
  # IAM-06 (B2): trusted L7 proxy hops in front of the Gateway's load balancer (platform/charts/shp-baseline/values.yaml).
  # 0 while nothing sits in front of the load balancer; set to 1 in the same change that puts Azure Front Door/WAF in
  # front of this Gateway (IAC-*). The per-client /idp rate limit only sees real client IPs once this matches reality.
  xffNumTrustedHops: 0
